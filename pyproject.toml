[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-bridge"
version = "0.4.20"
description = "Provider-independent model bridge foundation for OpenAgent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<10", "pytest-asyncio>=1.3,<2", "httpx>=0.27,<1"]
browser = ["playwright>=1.48,<2"]

[project.scripts]
openagent = "openagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
